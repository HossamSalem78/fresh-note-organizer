@if(authService.isLoggedIn()) {
  <header class="header">
    <div class="header-content">
      <div class="header-logo">
        <div class="header-logo-content">
          <h1 class="header-title">Note Organizer</h1>
          <p class="header-subtitle">Organize your thoughts, ideas, and memories</p>
        </div>
        <nav class="header-nav">
          <a routerLink="/notes" class="nav-item" routerLinkActive="active">Notes</a>
          <a routerLink="/teams" class="nav-item" routerLinkActive="active">Teams</a>
        </nav>
      </div>
      <div class="logged-user">
        <span>
          Welcome,
          <span>{{ authService.user()?.name }}</span>
        </span>
        <button (click)="logout()">Logout</button>
      </div>
    </div>
  </header>
}
