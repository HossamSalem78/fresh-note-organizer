<main>
    <div class="login-container">
        <h2>Login</h2>
        
        <form (ngSubmit)="onLogin()" class="login-form" [class.form-error]="messageType === 'error'">
          <div class="form-group" [class.error]="fieldErrors.email">
            <label for="email">Email</label>
            <input 
              type="email" 
              id="email" 
              [(ngModel)]="email" 
              name="email"
              placeholder="Enter your email"
              (focus)="onFieldFocus('email')"
              (input)="onEmailInput()"
              [class.error]="fieldErrors.email">
              @if(fieldErrors.email){
                <span class="error-message">Please enter a valid email</span>
              }
          </div>
          
          <div class="form-group" [class.error]="fieldErrors.password">
            <label for="password">Password</label>
            <input 
              type="password" 
              id="password" 
              [(ngModel)]="password" 
              name="password"
              placeholder="Enter your password"
              (focus)="onFieldFocus('password')"
              [class.error]="fieldErrors.password">
              @if(fieldErrors.password){
                <span class="error-message">Please enter a valid password</span>
              }
          </div>
          
          <button type="submit" class="btn btn-primary">
            {{ 'Login' }}
          </button>
        </form>
      
        @if(loginMessage) {
             <div class="message" 
             [class.success]="messageType === 'success'"
             [class.error]="messageType === 'error'"
             [class.info]="messageType === 'info'">
          {{ loginMessage }}
        </div>
        }
        <div class="register-link">
            <p>Don't have an account? <a routerLink="/register">Register here</a></p>
          </div>
      </div>
</main>
